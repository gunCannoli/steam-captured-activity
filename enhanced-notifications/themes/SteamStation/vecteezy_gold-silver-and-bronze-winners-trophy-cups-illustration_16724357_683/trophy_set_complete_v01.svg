<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3400 1500" width="3400" height="1500">
  <defs>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Complete 4-Tier Trophy Suite: Bronze, Silver, Gold, Platinum (Variation 01 - The Royal Winged Classic) -->
  <g id="trophy_suite_4tiers">
    <!-- 1. BRONZE TROPHY (Tier 1) -->
    <g id="tier1_bronze" transform="translate(180, 520)">
      <image href="bronze_trophy.svg" width="560" height="960" preserveAspectRatio="xMidYMax meet"/>
    </g>

    <!-- 2. SILVER TROPHY (Tier 2) -->
    <g id="tier2_silver" transform="translate(860, 520)">
      <image href="silver_trophy.svg" width="560" height="960" preserveAspectRatio="xMidYMax meet"/>
    </g>

    <!-- 3. GOLD TROPHY (Tier 3) -->
    <g id="tier3_gold" transform="translate(1560, 240)">
      <image href="gold_trophy.svg" width="700" height="1240" preserveAspectRatio="xMidYMax meet"/>
    </g>

    <!-- 4. PLATINUM TROPHY (Tier 4 Pinnacle: V01) -->
    <g id="tier4_platinum" transform="translate(2360, 80)">
      <image href="platinum_trophy_v01.svg" width="860" height="1400" preserveAspectRatio="xMidYMax meet"/>
    </g>
  </g>
</svg>